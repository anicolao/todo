name: CLI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cli-nix:
    name: CLI Nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build packaged CLI and service
        run: nix build --no-link --print-build-logs .#todo

      - name: Smoke test packaged launchers without credentials
        run: |
          nix run . -- help
          nix run .#todo -- help

  cli-gate:
    name: CLI Gate
    if: ${{ always() }}
    needs: [cli-tests, cli-nix]
    runs-on: ubuntu-22.04
    steps:
      - name: Require CLI tests and package builds to pass
        env:
          TEST_RESULT: ${{ needs.cli-tests.result }}
          NIX_RESULT: ${{ needs.cli-nix.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$NIX_RESULT" = success

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit -p cli/tsconfig.json

      - name: Run CLI unit tests
        run: npm run test:cli

      - name: Run CLI emulator test
        run: >-
          npx firebase emulators:exec --only auth,firestore
          "TODO_RUN_FIREBASE_EMULATOR_TESTS=true bun test cli/test/emulator.test.ts"
