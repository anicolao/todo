name: CLI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit -p cli/tsconfig.json

      - name: Run CLI unit tests
        run: npm run test:cli

      - name: Run CLI emulator test
        run: >-
          npx firebase emulators:exec --only auth,firestore
          "TODO_RUN_FIREBASE_EMULATOR_TESTS=true bun test cli/test/emulator.test.ts"
